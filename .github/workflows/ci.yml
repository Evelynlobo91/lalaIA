name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o workflow só lê o código.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  face-blur-agent:
    name: Agente de borrão de rostos (lógica)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/face-blur-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  integration:
    name: Testes de integração (Postgres + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sobe só o Postgres do Supabase e aplica todas as migrations (valida o db reset do zero).
      - run: npx supabase db start
      - run: npm run test:int

  e2e:
    name: Testes E2E (celular, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Supabase com Auth, API, Storage (fotos) e Mailpit; serviços que não usamos ficam de fora.
      - run: npx supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Exporta a configuração do Supabase local para o build
        run: |
          npx supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "MAILPIT_URL=$MAILPIT_URL"
            # Chave admin do Supabase LOCAL do CI (efêmero), usada só pelos testes para criar usuários.
            echo "E2E_SUPABASE_SECRET_KEY=$SECRET_KEY"
            # Segredo dos QR codes das missões: aleatório a cada execução (nunca fica no repositório).
            echo "MISSIONS_QR_SECRET=$(openssl rand -hex 32)"
            # Live com o provedor simulado (sem Mux no CI): segredo dos webhooks, aleatório a cada execução.
            echo "LIVE_FAKE_WEBHOOK_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      # Lugares reais de Joinville (snapshot do OpenStreetMap) para as telas de "Onde ir".
      - run: npm run places:seed
      - run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Orçamento de performance (#79): Lighthouse no build que acabou de passar no E2E (falha se estourar).
      - name: Orçamento de performance (Lighthouse CI)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/status && break; sleep 1; done
          export LHCI_PLACE_ID=$(psql "$DATABASE_URL" -tAc "select id from places.places where source_id not like 'e2e/%' order by name limit 1")
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: e2e/.lighthouse
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
